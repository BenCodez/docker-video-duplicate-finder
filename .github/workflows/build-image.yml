name: Fork image build and release

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to the fork's GHCR package
        type: boolean
        default: false
      image_tag:
        description: Explicit version/test tag (latest is reserved)
        type: string
        default: test
      application_commit:
        description: Full application commit SHA (empty uses the Dockerfile pin)
        type: string
        default: ''
      promote_latest:
        description: Intentionally promote a stable vX.Y.Z release to latest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/bencodez/video-duplicate-finder

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      application_commit: ${{ steps.prepare.outputs.application_commit }}
      image_tag: ${{ steps.prepare.outputs.image_tag }}
      commit_tag: ${{ steps.prepare.outputs.commit_tag }}
      publish: ${{ steps.prepare.outputs.publish }}
      promote_latest: ${{ steps.prepare.outputs.promote_latest }}
    steps:
      - uses: actions/checkout@v6
      - id: prepare
        name: Validate source pin and intentional release inputs
        env:
          REQUESTED_COMMIT: ${{ inputs.application_commit }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          REQUESTED_LATEST: ${{ inputs.promote_latest }}
        run: .github/scripts/prepare-release.sh

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Shell and startup regression checks
        run: |
          find rootfs src tests -type f -name '*.sh' -print | while IFS= read -r SCRIPT; do sh -n "$SCRIPT"; done
          sh -n rootfs/usr/bin/xdg-open
          bash -n .github/scripts/prepare-release.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download the pinned application
        env:
          APP_COMMIT: ${{ needs.prepare.outputs.application_commit }}
        run: |
          curl --fail --show-error --location --retry 3 "https://github.com/BenCodez/videoduplicatefinder/archive/$APP_COMMIT.tar.gz" -o /tmp/vdf-source.tar.gz
          mkdir -p /tmp/vdf-source
          tar --no-same-owner -xzf /tmp/vdf-source.tar.gz --strip-components=1 -C /tmp/vdf-source
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - name: Apply every patch and verify persistent application paths
        env:
          APP_COMMIT: ${{ needs.prepare.outputs.application_commit }}
        run: tests/check-patches.sh /tmp/vdf-source "$APP_COMMIT"

  build_and_smoke:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build a local image without registry credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          platforms: linux/${{ matrix.arch }}
          tags: vdf-ci:${{ matrix.arch }}
          build-args: |
            VIDEO_DUPLICATE_FINDER_COMMIT_SHA=${{ needs.prepare.outputs.application_commit }}
            DOCKER_IMAGE_VERSION=${{ needs.prepare.outputs.image_tag }}
            DOCKER_IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=vdf-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=vdf-${{ matrix.arch }}
      - name: GUI, browser/VNC, persistent restart and scan without a browser
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: tests/smoke-image.sh vdf-ci:${{ matrix.arch }}
      - name: Export the exact tested image
        if: needs.prepare.outputs.publish == 'true'
        run: docker image save vdf-ci:${{ matrix.arch }} | gzip -1 > /tmp/vdf-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: vdf-${{ matrix.arch }}
          path: /tmp/vdf-${{ matrix.arch }}.tar.gz
          retention-days: 1

  publish:
    needs: [prepare, build_and_smoke]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: vdf-*
          path: /tmp/vdf-images
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate only for the intentional fork publication
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architectures and create the multiarch manifest
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          COMMIT_TAG: ${{ needs.prepare.outputs.commit_tag }}
          PROMOTE_LATEST: ${{ needs.prepare.outputs.promote_latest }}
        run: |
          for ARCH in amd64 arm64; do
            gzip -dc "/tmp/vdf-images/vdf-$ARCH.tar.gz" | docker image load
            docker image tag "vdf-ci:$ARCH" "$IMAGE:$COMMIT_TAG-$ARCH"
            docker image push "$IMAGE:$COMMIT_TAG-$ARCH"
          done
          TAGS=(--tag "$IMAGE:$IMAGE_TAG" --tag "$IMAGE:$COMMIT_TAG")
          if [[ "$PROMOTE_LATEST" == true ]]; then TAGS+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:$COMMIT_TAG-amd64" "$IMAGE:$COMMIT_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$COMMIT_TAG"
